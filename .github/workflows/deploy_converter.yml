name: Auto-Redeploy Converter Bot

on:
  # Автоматическое обновление каждые 5 часов
  schedule:
    - cron: '0 */5 * * *'

  # Также выполняется при пушах в основную ветку
  push:
    branches:
      - main

jobs:
  auto_redeploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Setup Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.10'
      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
      - name: Run the Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          nohup python bot.py > log.out &
      - name: Clean Old Logs
        run: |
          rm -f log.out
